<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena — Restaurace U Kapalínů</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230E2A4D'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='38' font-weight='700' fill='%23E9A62B' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;600;700&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--inkoust:#0E2A4D;--papir:#FDF5E7;--zlata:#E9A62B;--cervena:#C0392B;--seda-sv:#A8BACB}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;min-height:100vh;background:var(--inkoust);color:var(--papir);
  font-family:"Figtree",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.65;
  display:grid;place-items:center;padding:clamp(1.5rem,6vw,4rem);text-align:center;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.cislo{
  font-family:"Archivo",Arial,sans-serif;font-variation-settings:"wdth" 120,"wght" 880;
  font-size:clamp(5rem,22vw,13rem);line-height:.9;letter-spacing:-.045em;color:var(--zlata);margin:0;
  padding-block:.02em .06em;
}
h1{
  font-family:"Archivo",Arial,sans-serif;font-variation-settings:"wdth" 110,"wght" 800;
  font-size:clamp(1.5rem,4vw,2.3rem);line-height:1.1;margin:1.25rem 0 0;letter-spacing:-.02em;
  padding-block:.02em .1em;
}
p{max-width:46ch;margin:1rem auto 0;color:var(--seda-sv)}
.stitek{font-family:"DM Mono",monospace;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;color:var(--zlata)}
.akce{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;margin-top:2.25rem}
.tl{
  display:inline-flex;align-items:center;gap:.5rem;padding:.95rem 1.7rem;border-radius:4px;
  background:var(--cervena);color:#fff;font-weight:700;font-size:.96rem;
  transition:background .25s ease,transform .25s cubic-bezier(.16,1,.3,1);
}
.tl:hover{background:#D9503F;transform:translateY(-2px)}
.tl--wa{background:#1FA855}
.tl--wa:hover{background:#25C765}
.tl--duch{background:transparent;box-shadow:inset 0 0 0 2px rgba(253,245,231,.32)}
.tl--duch:hover{background:var(--papir);color:var(--inkoust);box-shadow:inset 0 0 0 2px var(--papir)}
.pata{margin-top:2.75rem;font-family:"DM Mono",monospace;font-size:.72rem;color:rgba(168,186,203,.7);line-height:1.8}
</style>
</head>
<body>
  <main>
    <p class="stitek">Chyba 404</p>
    <p class="cislo">404</p>
    <h1>Tuhle stránku jsme nenašli</h1>
    <p>Možná se přejmenovala, možná jste se ťukli v adrese.
       Kuchyně ale vaří dál — vraťte se na hlavní stránku.</p>
    <div class="akce">
      <a class="tl" href="/">Zpátky na web</a>
      <a class="tl tl--wa" href="https://wa.me/420603857142" target="_blank" rel="noopener">WhatsApp</a>
      <a class="tl tl--duch" href="tel:+420603857142">603 857 142</a>
    </div>
    <p class="pata">
      Restaurace U Kapalínů &nbsp;·&nbsp; Hostivická 8/10, Sobín, Praha 17<br>
      Po–pá 10:00–22:00 &nbsp;·&nbsp; So–ne 10:30–22:00
    </p>
  </main>
</body>
</html>
